<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>使用 background-clip 製作文字背景效果</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background-color: #fff;
      padding: 50px;
    }

    h2 {
      font-size: 36px;
      margin-bottom: 40px;
    }

    .text-style {
      font-size: 80px;
      font-weight: bold;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      margin: 40px 0;
    }

    /* 樣式一：黑漸層 + 彩虹背景（文字上黑下透明） */
    .style1 {
      background: linear-gradient(to right, red, orange, yellow, green, blue);
      -webkit-text-fill-color: black; /* 保留黑色文字顯示 */
      -webkit-background-clip: border-box; /* 非文字裁切 */
    }

    /* 樣式二：橘→黃→綠→藍 漸層背景裁切到文字 */
    .style2 {
      background: linear-gradient(to right, orange, yellow, green, deepskyblue);
    }

    /* 樣式三：紅→橘→黃 水平漸層文字 */
    .style3 {
      background: linear-gradient(to right, red, orange, gold);
    }

    /* 樣式四：城市圖片作為文字背景 */
    .style4 {
      background: url('https://picsum.photos/id/1011/1000/400') center center / cover no-repeat;
    }
  </style>
</head>
<body>

  <h2>使用 <code>background-clip</code> 製作文字背景效果</h2>

  <div class="text-style style1">HAVE A NICE DAY !</div>
  <div class="text-style style2">HAVE A NICE DAY !</div>
  <div class="text-style style3">HAVE A NICE DAY !</div>
  <div class="text-style style4">HAVE A NICE DAY !</div>

</body>
</html>
