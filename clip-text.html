<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Gradient Text</title>
<style>
h1 {
  margin: 10px;
  padding: 0;
  width: max-content;
  font-family: impact, arial-black;  /* 設定成比較粗的字體 */
  font-size: 80px;
  line-height: 1;
}

/* 沒有設定 background-clip 就不會進行裁切 */
.a0 {
  background: linear-gradient(#f00, #f90, #fd0, #0c0, #09f);
}

/* 文字顏色設定為透明 + background-clip: text */
.a1 {
  color: #0000;  /* 設定透明色 */
  background: linear-gradient(#f00, #f90, #fd0, #0c0, #09f);
  background-clip: text;
  -webkit-background-clip: text;
}

/* 線性漸層位置調整 */
.a2 {
  color: #0000;
  background: linear-gradient(#f00 50%, #fa0 50%);
  background-clip: text;
  -webkit-background-clip: text;
}

/* 圖片作為背景 */
.a3 {
  color: #0000;
  background: url(https://img.freepik.com/free-photo/empty-sea-beach-background_74190-313.jpg);
  background-clip: text;
  -webkit-background-clip: text;
}
</style>
</head>
<body>

<h1 class="a0">Hello</h1>
<h1 class="a1">Hello</h1>
<h1 class="a2">Hello</h1>
<h1 class="a3">Hello</h1>

</body>
</html>
