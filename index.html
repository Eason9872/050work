<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Top Navigation 範例</title>
  <style>
    body { margin: 0; font-family: Arial; }
    .navbar {
      overflow: hidden;
      background-color: #333;
    }
    .navbar a {
      float: left;
      display: block;
      color: #f2f2f2;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }
    .navbar a:hover {
      background-color: #ddd;
      color: black;
    }
    .navbar a.active {
      background-color: #04AA6D;
      color: white;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    
  </style>
</head>
<body>

<div class="navbar">
  <a href="home.html" target="contentFrame" class="active">首頁</a>
  <a href="apple.html" target="contentFrame">文字設計</a>
  <a href="clip-text.html" target="contentFrame">文字背景</a>
  <a href="contact.html" target="contentFrame">聯絡資訊</a>
</div>

<iframe name="contentFrame" src="home.html"></iframe>

<script>
  // 抓所有導覽按鈕
  const navLinks = document.querySelectorAll('.navbar a');

  navLinks.forEach(link => {
    link.addEventListener('click', function() {
      // 移除所有 active
      navLinks.forEach(l => l.classList.remove('active'));
      // 將目前點擊的這個加上 active
      this.classList.add('active');
    });
  });
</script>
</body>

</html>
