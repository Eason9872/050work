<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>聯絡我</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .contact-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 15px;
      color: #555;
    }

    input, textarea {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      background-color: #04AA6D;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #03895b;
    }
  </style>
</head>
<body>

<div class="contact-container">
  <h2>聯絡我</h2>
  <form action="https://formspree.io/f/mkgjnqqg" method="POST">
    <label for="name">姓名</label>
    <input type="text" id="name" name="name" required>

    <label for="email">電子信箱</label>
    <input type="email" id="email" name="email" required>

    <label for="message">留言內容</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">送出</button>
  </form>
</div>

</body>
</html>
